<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>terminal-slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="window" id="window">
  <header class="titlebar">
    <span class="dots"><i></i><i></i><i></i></span>
    <span class="title" id="title">guest@slides: ~</span>
    <span class="count" id="count"></span>
  </header>
  <section class="screen" id="screen" aria-live="polite"></section>
  <footer class="statusbar">
    <div class="prompt" id="idle"></div>
    <div class="hint">← → navigate &nbsp; space next &nbsp; any key skips typing</div>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
